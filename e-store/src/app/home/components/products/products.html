<div class="main-product-container">
    <div *ngFor="let product of products;let i=index" class="mx-5 p-3 product-card">
        <div class="product-image-container">{{product.product_img }}
            <img [src]="'assets/images/'+product.product_img+'.jpg'" alt="not found img">
        </div>
        <div class="product-info">
            <h5><a href="#">{{product.product_name}}</a></h5>
            <p class="product-price">{{product.price|currency}}</p>
        </div>
    </div>
</div>
